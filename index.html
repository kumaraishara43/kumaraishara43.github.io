<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Full Screen Embed</title>
    <style>
        body {
            margin: 0;
            background-color: #121212; /* dark background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* full height */
        }
        #widgetApiIframe {
            border: none;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>

<iframe id="widgetApiIframe" allowtransparency="true" scrolling="no"
        src="https://p.oceansaver.in/api/widget?adUrl="></iframe>

<!-- Put the Library in your <head> tag -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.9/iframeResizer.min.js"></script>
<!-- Put the resizer code after the <iframe> tag -->
<script>
    iFrameResize({ log: false }, '#widgetApiIframe');
</script>

</body>
</html>
