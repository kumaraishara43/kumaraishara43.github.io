<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Full Screen Embed</title>
    <style>
        /* Ensures the iframe takes up the entire screen */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<iframe id="widgetApiIframe" width="100%" height="100%" allowtransparency="true" scrolling="no" style="border: none" src="https://p.oceansaver.in/api/widget?adUrl="></iframe>
<!-- Put the Library in your <head> tag -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.9/iframeResizer.min.js"></script>
<!-- Put the resizer code after the <iframe> tag -->
<script> iFrameResize({ log: false }, '#widgetApiIframe') </script>

    
</body>
</html>
